<div Ngxheadroom [options]="options" class="fixed-navbar">
  <app-navigation></app-navigation>
</div>
<div class="height"></div>

<ng-template #zzz let-modal>
  <div class="modal-body bg-info">
    <img [src]="apiUrl+'/'+ text" class="img-fluid w-100" (error)="onImgError($event)">
  </div>
  <div class="modal-footer p-1">
    <button class="btn btn-info shadow-none" (click)="modal.close()">Close</button>
  </div>
</ng-template>


<ng-template #ww let-modal>
  <form class="container p-3" (submit)="updatenews(_title, description)">
    <div class="row p-0">
      <div class="form-group mb-3">
        <label for="exampleFormControlInput1" class="form-label">Título</label>
        <input type="text" class="form-control" placeholder="Photo's Title" #_title [value]="title">
      </div>
      <div class="form-group mb-3 ">
        <div class="form-group mb-3 ">
          <label for="exampleFormControlInput1" class="form-label">Descripción</label>
          <ckeditor [config]="configg" [editor]="Editor" [(ngModel)]="markdown" [ngModelOptions]="{standalone:true}">
          </ckeditor>
          <textarea rows="5" cols="0" class="d-none" [(ngModel)]="markdown" [ngModelOptions]="{standalone:true}"
            [value]="description" #description></textarea>
        </div>
      </div>
    </div>
    <input type="file" class="d-none" (change)="capturandoFile($event)" #photoInput>
    <div class="text-center">
      <img [src]="photoSelected || apiUrl+'/'+ img" class="m-auto w-25 cursorpoint img-fluid"
        (error)="onImgError($event)" alt="No image" (click)="photoInput.click()">
    </div>
    <div *ngIf="!photoSelected && img" class="bg-light text-center border rounded">
      {{img}}
    </div>
    <div *ngIf="photoSelected && name" class="bg-light text-center border rounded">
      {{name}}
    </div>
    <ngx-extended-pdf-viewer *ngIf="photoSelected && type=='application/pdf'" [src]="photoSelected" [height]="'1000px'"
      [useBrowserLocale]="false" [textLayer]="true" [showHandToolButton]="true">
    </ngx-extended-pdf-viewer>

    <ngx-extended-pdf-viewer *ngIf="img && !photoSelected && img.split('.').pop()=='pdf'" [src]="apiUrl+'/'+ img"
      [height]="'800px'" [useBrowserLocale]="false" [textLayer]="true" [showHandToolButton]="false">
    </ngx-extended-pdf-viewer>
    <mat-progress-bar *ngIf="value > 0 && photoSelected" color="accent" mode="determinate"
      [value]="value"></mat-progress-bar>
    {{ loading=='false' ? 'Cargando '+value+'%': null}}
    <button class="btn d-none" [disabled]="loading" #www></button>
  </form>
  <div class="modal-footer">
    <button class="btn btn-info mt-1" [disabled]="loading" (click)="www.click()">{{ loading=='false' ? 'Cargando':
      'Actualizar'}}</button>
    <button class="btn btn-info shadow-none" (click)="modal.close()">Cerrar</button>
  </div>
</ng-template>

<ng-template #w let-modal>
  <div class="modal-header">
    {{title}}
  </div>
  <div class="modal-body bg-light">
    <ng-katex-html *ngIf="markdown" [html]="markdown"></ng-katex-html>
    <div *ngIf="img">
      <img
        *ngIf="img.split('.').pop()=='png'||img.split('.').pop()=='jpg'||img.split('.').pop()=='jpeg'||img.split('.').pop()=='svg'||img.split('.').pop()=='webp'"
        [src]="apiUrl+'/'+ img" class="img-fluid w-100" (error)="onImgError($event)">
      <div class="border rounded">{{img}}</div>
      <ngx-doc-viewer *ngIf="img.split('.').pop()=='doc'" [url]="apiUrl+'/'+ img" viewer="google"
        style="width:100%;height:100vh;"></ngx-doc-viewer>
      <ngx-doc-viewer
        *ngIf="img.split('.').pop()=='docx' || img.split('.').pop()=='pptx'|| img.split('.').pop()=='ptx' || img.split('.').pop()=='xlsx'|| img.split('.').pop()=='xls'"
        [url]="apiUrl+'/'+ img" viewer="google" style="width:100%;height:800px;"></ngx-doc-viewer>
      <ngx-extended-pdf-viewer *ngIf="img.split('.').pop()=='pdf'" [src]="apiUrl+'/'+ img"
        [height]="'500px'"></ngx-extended-pdf-viewer>
    </div>
  </div>

  <div class="modal-footer">
    <button class="btn btn-info shadow-none" (click)="modal.close()">Cerrar</button>
  </div>
</ng-template>

<div class="container">
  <div class="d-flex justify-content-center align-items-center bg-ligth">
    <button *ngIf="rol=='5' || rol=='1'" class="btn btn-info mt-2" (click)="create()">Crear</button>
  </div>
</div>

<div *ngIf="data.length!==0" class="container py-1 px-0">

  <div *ngFor="let doc of data index as i">
    <div class="">
      <div class="h5" *ngIf="doc.title">{{doc.title}}</div>
      <ng-katex-html *ngIf="doc.description" [html]="doc.description"></ng-katex-html>

      <div *ngIf="doc.file" class="p-0 mt-1">
        <img
          *ngIf="doc.file.split('.').pop()=='png'||doc.file.split('.').pop()=='jpg'||doc.file.split('.').pop()=='jpeg'||doc.file.split('.').pop()=='svg'||doc.file.split('.').pop()=='webp'"
          [src]="apiUrl+'/'+ doc.file" class="img-fluid w-100" (error)="onImgError($event)">
        <div class="border rounded">{{img}}</div>
        <ngx-doc-viewer *ngIf="doc.file.split('.').pop()=='doc'" [url]="apiUrl+'/'+ doc.file" viewer="google"
          style="width:100%;height:100vh;"></ngx-doc-viewer>
        <ngx-doc-viewer
          *ngIf="doc.file.split('.').pop()=='docx' || doc.file.split('.').pop()=='pptx'|| doc.file.split('.').pop()=='ptx' || doc.file.split('.').pop()=='xlsx'|| doc.file.split('.').pop()=='xls'"
          [url]="apiUrl+'/'+ doc.file" viewer="google" style="width:100%;height:800px;"></ngx-doc-viewer>
        <ngx-extended-pdf-viewer *ngIf="doc.file.split('.').pop()=='pdf'" [src]="apiUrl+'/'+ doc.file"
          [useBrowserLocale]="true"></ngx-extended-pdf-viewer>

      </div>
      <div class="p-0">

        <button *ngIf="rol=='5' || rol=='1'" class="btn btn-danger shadow-none rounded-0"
          (click)="delete(doc._id)">Eliminar</button>
        <button *ngIf="rol=='5' || rol=='1'" class="btn btn-info shadow-none rounded-0"
          (click)="open1(ww, doc._id, doc.title, doc.description, doc.file)">Editar
        </button>
        <button *ngIf="rol=='5' || rol=='1'" class="btn btn-warning shadow-none rounded-0"
          (click)="open2(w, doc._id, doc.title, doc.description, doc.file)">Show</button>
      </div>
    </div>
  </div>

  <div *ngFor="let w of wwwww index as i" class="p-1">
    <div class="border rounded justify-content-left align-items-center">
      <div class="container d-flex p-0 w-100">
        <!-- <img [src]="apiUrl+'/'+ $any(w).foto" (error)="onImgError($event)" class="wrapperest10"> -->
        <div
          [ngClass]="[$any(w).mencion=='G' || $any(w).mencion=='P' || $any(w).mencion=='E' ||$any(w).mencion=='ED' ? 'text-info p-1':' p-1']">
          {{i+1}}.
          <button class="btn btn-light" (click)="open2w(zzz, $any(w).foto)" style="cursor:pointer">{{$any(w).name}}
          </button><br>
          <!-- <span class="text-primary"> {{$any(w).email}} </span> -->
          <span class="text-primary">dni: {{$any(w).dni}} </span><br>
          <span class="text-primary">celular: {{$any(w).celular}} </span><br>
          <span> {{$any(w).rol==3?'mención: ':'grado: '}} <span class="text-warning"> {{$any(w).mencion}} </span>
          </span><br>
          <!-- <button class="btn btn-light" (click)="open2(zzz, $any(w).foto)"
            style="cursor:pointer">{{$any(w).mencion}}</button> -->



          <div *ngFor="let itemwww of w['filecursses']; let i=index" class="row d-flex">
            <div class="p-0  text-center border btn-group col-md-3">
              <button class="btn btn-info" (click)="open2w(zzz, itemwww.img)"
                style="cursor:pointer">{{itemwww.title}}</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
